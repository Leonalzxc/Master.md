name: Production hotfix quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/fix-production-job-schema]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm audit --omit=dev
